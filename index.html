<style>
  :root {
    --oro: #8d6c43;
    --oro-claro: #b08d5e;
    --tinta: #5a4632;
    --papel: #f3eee6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #e7ded1;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--tinta);
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    background: var(--papel);
    box-shadow: 0 0 40px rgba(90,70,50,.18);
    overflow: hidden;
    container-type: inline-size;
  }

  /* Cada pieza: imagen a ancho completo + capa de elementos posicionados en % */
  .pieza {
    position: relative;
    container-type: inline-size;
    line-height: 0;
  }
  .pieza > img { width: 100%; height: auto; display: block; }
  .hot {
    position: absolute;
    display: block;
    cursor: pointer;
    background: transparent;
    border: 0;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    border-radius: 999px;
  }

  /* Piezas pegadas: cada una se monta 1px sobre la anterior para que no aparezca línea de corte */
  .pieza + .pieza { margin-top: -1px; }

  /* Fundido entre piezas: cada una se monta 8cqw sobre la anterior y su borde superior se disuelve */
  .pieza.funde {
    margin-top: -8cqw;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 8cqw);
    mask-image: linear-gradient(to bottom, transparent, #000 8cqw);
  }

  /* Portada: entra con un fundido lento */
  .portada > img { animation: aparece 1.8s ease-out both; }
  @keyframes aparece {
    from { opacity: 0; transform: scale(1.03); }
    to   { opacity: 1; transform: none; }
  }

  /* Invitados: las dos frases y los nombres van como texto vivo */
  .inv-frase {
    position: absolute;
    left: 0; right: 0;
    transform: translateY(-50%);
    text-align: center;
    line-height: 1;
    font-weight: 500;
    font-size: 3.05cqw;
    letter-spacing: .34em;
    text-indent: .34em;
    color: var(--oro);
    white-space: nowrap;
  }
  .inv-frase.arriba { top: 29.4%; }
  .inv-frase.abajo  { top: 67.6%; }
  .inv-nombre {
    position: absolute;
    left: 9%; right: 9%;
    top: 37%; height: 24%;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    line-height: 1.12;
    font-style: italic;
    font-weight: 300;
    font-size: 10.5cqw;
    color: var(--tinta);
  }
  .inv-nombre:not(:empty)::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 8%;
    width: 12cqw; height: 1px;
    transform: translateX(-50%);
    background: var(--oro-claro);
    opacity: .7;
  }

  /* Cuenta regresiva */
  .cd {
    position: absolute;
    top: 46.3%;
    width: 22%;
    transform: translate(-50%, -50%);
    text-align: center;
    line-height: 1;
    font-weight: 300;
    font-size: 15.4cqw;
    color: var(--oro);
    font-variant-numeric: lining-nums tabular-nums;
  }
  .cd.cambia { animation: cambia .55s ease-out; }
  @keyframes cambia {
    from { opacity: 0; transform: translate(-50%, -62%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }

  /* Vinilo: el disco se dibuja "de frente" (dorado cepillado, surcos y línea interior) y la perspectiva
     del tocadiscos se rehace con rotate + scaleY. Gira entero con la etiqueta C M. */
  .disco {
    position: absolute;
    left: 80.765%; top: 70.066%;
    width: 104.36%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%) rotate(5deg) scaleY(.84);
    pointer-events: none;
  }
  .vinilo {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    background:
      /* línea dorada interior */
      radial-gradient(circle closest-side, transparent 48.7%, rgba(176,134,84,.9) 49%, rgba(176,134,84,.9) 49.35%, transparent 49.65%),
      /* aro de luz alrededor de la etiqueta */
      radial-gradient(circle closest-side, rgba(255,251,245,.55) 32%, rgba(255,251,245,0) 36.5%),
      /* bisel del borde */
      radial-gradient(circle closest-side, transparent 97.6%, rgba(150,112,70,.45) 99%, rgba(255,248,236,.5) 100%),
      /* surcos (muy sutiles) */
      repeating-radial-gradient(circle, rgba(150,112,70,.035) 0 .8px, rgba(255,252,246,.045) .8px 2.2px),
      /* reflejos dorados: lóbulos de distinto ancho para que el giro se note */
      conic-gradient(from 20deg,
        #e3cfb6, #f0e3d2 5%, #fbf6ef 10%, #fffcf7 12%, #f6ecdf 15%, #ead8c2 21%, #dfc8ab 30%,
        #e6d3bb 36%, #f3e8da 40%, #e5d1b8 44%, #dcc4a6 50%,
        #ecdcc8 56%, #faf3ea 61%, #fefaf3 63.5%, #f4e9db 67%, #e8d5bf 73%, #dbc2a3 82%,
        #e8d6c0 88%, #f5ebde 91%, #e7d4bd 95%, #e3cfb6);
    animation: gira 4s linear infinite;
  }
  .vinilo img {
    position: absolute;
    left: 50%; top: 50%;
    width: 32.18%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(176,134,84,.25);
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  /* Eje (en el centro exacto de giro), brazo y púa: fijos encima del disco */
  .pieza > img.fijo {
    position: absolute;
    pointer-events: none;
  }
  .fijo.eje     { left: 77.577%; top: 68.152%; width: 6.376%; }
  .fijo.brazo   { left: 92.243%; top: 43.541%; width: 7.758%; }
  .fijo.capsula { left: 76.939%; top: 72.488%; width: 23.061%; filter: drop-shadow(-1.2cqw 1.4cqw 1.2cqw rgba(90,62,32,.28)); }
  .fijo.brazo   { filter: drop-shadow(-1cqw .8cqw 1cqw rgba(90,62,32,.22)); }

  /* Texto del botón de música (reemplaza al "REPRODUCIR" de la imagen) */
  .btn-texto {
    position: absolute;
    left: 36.98%; top: 38.97%;
    transform: translate(-50%, -50%);
    line-height: 1;
    font-weight: 500;
    font-size: 3.15cqw;
    letter-spacing: .26em;
    text-indent: .26em;
    color: #6f5843;
    white-space: nowrap;
    pointer-events: none;
  }

  /* Ondas doradas al tocar un botón */
  .onda {
    position: absolute;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(176,141,94,.5) 0%, rgba(176,141,94,.2) 45%, rgba(176,141,94,0) 70%);
    pointer-events: none;
    animation: onda .7s ease-out forwards;
  }
  @keyframes onda {
    from { transform: scale(0); opacity: 1; }
    to   { transform: scale(18); opacity: 0; }
  }

  /* Destello que recorre el botón de confirmar */
  .brillo {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,246,228,.55) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%;
    animation: brillo 4.5s ease-in-out infinite;
  }
  @keyframes brillo {
    0%        { background-position: 130% 0; }
    45%, 100% { background-position: -30% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .portada > img, .cd.cambia, .brillo { animation: none; }
    .vinilo { animation-duration: 12s; }
  }

  /* Intro: el papel con ondas de la invitación a pantalla completa, con los nombres y la elección de música */
  body.con-intro { overflow: hidden; }
  .intro {
    position: fixed; inset: 0;
    z-index: 80;
    overflow: hidden;
    background: url("assets/02-invitados.jpg") center / cover no-repeat var(--papel);
    transition: opacity .9s ease .25s, visibility .9s .25s;
  }
  /* Al entrar: primero se van los textos, después la intro se desvanece hacia el papel */
  .intro.abriendo { opacity: 0; visibility: hidden; }
  .intro .contenido {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
    transition: opacity .35s;
    animation: aparece-intro 1.6s ease-out both;
  }
  .intro.abriendo .contenido { opacity: 0; pointer-events: none; animation: none; }
  @keyframes aparece-intro {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  .intro .antetitulo {
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .42em;
    text-indent: .42em;
    color: var(--oro);
  }
  .intro .nombres {
    margin: 22px 0 18px;
    font-weight: 400;
    line-height: 1;
    color: var(--oro);
  }
  .intro .nombres span {
    display: block;
    font-size: clamp(40px, 13vw, 58px);
    letter-spacing: .1em;
    text-indent: .1em;
  }
  .intro .nombres em {
    display: block;
    margin: 4px 0 6px;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(40px, 12vw, 54px);
    color: var(--oro-claro);
  }
  .intro .linea {
    width: 56px; height: 1px;
    margin: 14px auto 38px;
    background: var(--oro-claro);
    opacity: .7;
  }
  .intro .entrar {
    display: block;
    width: min(280px, 78vw);
    padding: 15px 10px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: .24em;
    text-indent: .24em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .2s, box-shadow .2s;
  }
  .intro .entrar:active { transform: scale(.97); }
  /* mismo bronce satinado del botón "Confirmar asistencia" */
  .intro .con-musica {
    border: 1px solid #b08a63;
    background: linear-gradient(180deg, #caa37f 0%, #b88d66 55%, #a97f5a 100%);
    color: #fbf4ea;
    box-shadow: 0 6px 16px rgba(120,84,50,.28), inset 0 1px 0 rgba(255,240,220,.45);
  }
  /* mismo trazo fino de los botones "Cómo llegar" */
  .intro .sin-musica {
    margin-top: 14px;
    border: 1px solid rgba(176,141,94,.75);
    background: rgba(255,252,247,.55);
    color: var(--oro);
  }
  .intro .entrar svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 8px; }

  /* Portada: queda oculta bajo la intro y aparece recién cuando la intro ya se fue */
  body.con-intro .portada > img { opacity: 0; animation: none; }
  .portada > img { animation-delay: .9s; }

  /* Botón flotante de música (nota musical) */
  .btn-musica {
    position: fixed;
    right: max(16px, calc(50vw - 240px + 16px));
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 40;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(176,141,94,.7);
    background: rgba(252,248,242,.92);
    color: var(--oro);
    display: none; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(90,70,50,.22);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-musica svg { width: 22px; height: 22px; display: block; }
  .btn-musica.visible { display: flex; }
  /* sonando: un aro dorado late alrededor */
  .btn-musica::after {
    content: "";
    position: absolute; inset: -1px;
    border-radius: 50%;
    border: 1px solid rgba(176,141,94,.6);
    animation: aro 2.2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes aro {
    from { transform: scale(1);   opacity: .9; }
    to   { transform: scale(1.5); opacity: 0; }
  }
  /* pausada: sin aro y con la nota tachada */
  .btn-musica.pausada::after { display: none; }
  .btn-musica .tachado { opacity: 0; transition: opacity .2s; }
  .btn-musica.pausada .tachado { opacity: 1; }
  .btn-musica.pausada svg .nota { opacity: .55; }

  /* Modal datos bancarios */
  .modal {
    position: fixed; inset: 0;
    z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 16px;
    background: rgba(60,46,32,.55);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden;
    transition: opacity .3s, visibility .3s;
  }
  .modal.abierto { opacity: 1; visibility: visible; }
  .modal .tarjeta {
    position: relative;
    width: min(100%, 400px, calc((100dvh - 80px) * 1024 / 1536));
    line-height: 0;
    transform: translateY(16px) scale(.97);
    transition: transform .35s ease;
    box-shadow: 0 20px 50px rgba(40,30,20,.35);
    border-radius: 6px;
    overflow: hidden;
  }
  .modal.abierto .tarjeta { transform: none; }
  .modal .tarjeta img { width: 100%; display: block; }
  .modal .tarjeta .hot { border-radius: 4px; }
  .modal .ayuda {
    margin-top: 14px;
    font-size: 16px;
    font-style: italic;
    letter-spacing: .06em;
    color: #f7f1e8;
  }

  .toast {
    position: fixed; left: 50%; bottom: 32px;
    z-index: 60;
    transform: translate(-50%, 20px);
    background: var(--tinta); color: var(--papel);
    padding: 10px 20px;
    font-size: 17px; letter-spacing: .08em;
    border-radius: 2px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<script>
  // ===== Configuración =====
  const EVENTO = new Date('2027-01-15T20:00:00-03:00');
  const LINKS = {
    ceremonia:   'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Parroquia Nuestra Señora de la Guardia, Victoria, San Fernando, Buenos Aires'),
    celebracion: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Palacio Sans Souci, Paz 705, Victoria, Buenos Aires'),
    musica:      'https://open.spotify.com/playlist/6OTZqdJFjTqrqwiRtYFs3E?si=m9T_FAojQAOIIrbRw5pOig&pi=d7LS_VEpSfKX1&pt=389ade531883309965b67dff1197669f',
    whatsapp:    'https://wa.me/541140436324',
    instagram:   'https://www.instagram.com/bloomdate.invitaciones/',
    web:         'https://bloomdate-site.netlify.app/'
  };

  document.querySelectorAll('[data-link]').forEach(a => {
    a.href = LINKS[a.dataset.link] || '#';
  });

  // ===== Cuenta regresiva =====
  const cd = {
    d: document.getElementById('cdDias'),
    h: document.getElementById('cdHoras'),
    m: document.getElementById('cdMin'),
    s: document.getElementById('cdSeg')
  };
  function tick() {
    let diff = Math.max(0, EVENTO - Date.now()) / 1000;
    const d = Math.floor(diff / 86400); diff -= d * 86400;
    const h = Math.floor(diff / 3600);  diff -= h * 3600;
    const m = Math.floor(diff / 60);
    const s = Math.floor(diff - m * 60);
    poner(cd.d, String(d).padStart(2, '0'));
    poner(cd.h, String(h).padStart(2, '0'));
    poner(cd.m, String(m).padStart(2, '0'));
    poner(cd.s, String(s).padStart(2, '0'));
  }
  // solo anima el número que cambió
  function poner(el, valor) {
    if (el.textContent === valor) return;
    el.textContent = valor;
    el.classList.remove('cambia');
    void el.offsetWidth;
    el.classList.add('cambia');
  }
  tick();
  setInterval(tick, 1000);

  // ===== Modal regalos =====
  const modal = document.getElementById('modalRegalos');
  const toast = document.getElementById('toast');
  const abrir = () => { modal.classList.add('abierto'); document.body.style.overflow = 'hidden'; };
  const cerrar = () => { modal.classList.remove('abierto'); document.body.style.overflow = ''; };
  document.getElementById('abrirRegalos').addEventListener('click', abrir);
  document.getElementById('cerrarRegalos').addEventListener('click', cerrar);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.classList.contains('ayuda')) cerrar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });

  let toastTimer;
  document.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', async () => {
    const texto = b.dataset.copiar;
    try {
      await navigator.clipboard.writeText(texto);
    } catch {
      const t = document.createElement('textarea');
      t.value = texto; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch {}
      t.remove();
    }
    toast.textContent = b.dataset.nombre + ' copiado';
    toast.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('visible'), 1800);
  }));

  // ===== Ondas al tocar botones =====
  document.querySelectorAll('.hot').forEach(b => b.addEventListener('pointerdown', e => {
    const r = b.getBoundingClientRect();
    const o = document.createElement('span');
    o.className = 'onda';
    o.style.left = (e.clientX - r.left) + 'px';
    o.style.top = (e.clientY - r.top) + 'px';
    b.appendChild(o);
    setTimeout(() => o.remove(), 750);
  }));

  // ===== Confirmar asistencia =====
  // Sin token el link queda en "#": no abre nada.
  document.getElementById('boton-confirmar').addEventListener('click', e => {
    if (e.currentTarget.getAttribute('href') === '#') e.preventDefault();
  });

  // ===== Intro y música =====
  const intro = document.getElementById('intro');
  const audio = document.getElementById('musica');
  const btnMusica = document.getElementById('btnMusica');
  function entrar(conMusica) {
    intro.classList.add('abriendo');
    document.body.classList.remove('con-intro');
    window.scrollTo(0, 0);
    // la nota queda siempre a mano: si entraron sin música, la pueden prender desde ahí
    btnMusica.classList.add('visible');
    if (conMusica) audio.play().catch(() => btnMusica.classList.add('pausada'));
    else btnMusica.classList.add('pausada');
  }
  document.getElementById('entrarConMusica').addEventListener('click', () => entrar(true));
  document.getElementById('entrarSinMusica').addEventListener('click', () => entrar(false));
  btnMusica.addEventListener('click', () => {
    if (audio.paused) audio.play(); else audio.pause();
  });
  audio.addEventListener('play', () => { btnMusica.classList.remove('pausada'); btnMusica.setAttribute('aria-label', 'Pausar música'); });
  audio.addEventListener('pause', () => { btnMusica.classList.add('pausada'); btnMusica.setAttribute('aria-label', 'Reproducir música'); });
  // si el celular se bloquea o cambia de app, pausar
  document.addEventListener('visibilitychange', () => { if (document.hidden && !audio.paused) audio.pause(); });
</script>

  function formatNames(names) {
    if (names.length === 1) return names[0];
    return names.slice(0, -1).join(", ") + " y " + names[names.length - 1];
  }

  async function initInvitation() {
    var token = new URLSearchParams(window.location.search).get("invite");
    if (!token) return;

    try {
      var response = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_invite_by_token", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ p_token: token })
      });

      if (!response.ok) return;
      var rows = await response.json();
      var invite = rows && rows[0];
      if (!invite) return;

      var companions = invite.companions || [];
      var names = [invite.first_name].concat(
        companions.map(function (companion) { return companion.first_name; })
      ).filter(Boolean);
      if (!names.length) return;

      var namesEl = document.getElementById("nombres-invitados");
      if (namesEl) namesEl.textContent = formatNames(names);

      // Frase del diseño ("Reservamos ___ lugares para ustedes") escrita por código, en singular o plural
      var totalPasses = 1 + companions.length;
      var passesEl = document.getElementById("cantidad-lugares");

        passesEl.textContent = totalPasses === 1
          ? "RESERVAMOS 1 LUGAR PARA VOS"
          : "RESERVAMOS " + totalPasses + " LUGARES PARA USTEDES";
      }

      var confirmBtn = document.getElementById("boton-confirmar");
      if (confirmBtn && invite.event_slug) {
        confirmBtn.href = RSVP_BASE + "/r/" + encodeURIComponent(invite.event_slug) + "?invite=" + encodeURIComponent(token);
      }
    } catch (_error) {
      return;
    }
  }

  initInvitation();
})();
